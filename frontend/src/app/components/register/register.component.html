<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Crear cuenta</mat-card-title>
      <mat-card-subtitle>Regístrate en Chat</mat-card-subtitle>
    </mat-card-header>

    <form class="auth-form" (ngSubmit)="onRegister()">
      <mat-card-content>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" [(ngModel)]="email" name="email" placeholder="tu@email.com" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" [(ngModel)]="password" name="password" placeholder="Mínimo 6 caracteres" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirmar contraseña</mat-label>
          <input matInput type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Repite la contraseña" />
        </mat-form-field>

        @if (errorMessage) {
          <div class="error-message">{{ errorMessage }}</div>
        }
      </mat-card-content>

      <mat-card-actions>
        <button mat-flat-button color="primary" type="submit" class="full-width" [disabled]="loading">
          {{ loading ? 'Creando cuenta...' : 'Registrarse' }}
        </button>

        <mat-divider />

        <button mat-stroked-button type="button" class="full-width" (click)="goToLogin()">
          ¿Ya tienes cuenta? Inicia sesión
        </button>
      </mat-card-actions>
    </form>
  </mat-card>
</div>
