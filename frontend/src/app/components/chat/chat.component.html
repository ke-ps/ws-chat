<mat-card class="chat-container">
  <mat-card-header>
    <mat-card-title>Chat en tiempo real</mat-card-title>
  </mat-card-header>

  <mat-card-content class="messages-list">
    @for (message of messages$ | async; track trackByMessageId($index, message)) {
      <div class="message" [class.mine]="message.sender === 'Tú'">
        <span class="sender">{{ message.sender }}</span>
        <span class="content">{{ message.content }}</span>
        <span class="timestamp">{{ message.timestamp | date:'short' }}</span>
      </div>
    }
  </mat-card-content>

  <mat-card-actions class="input-area">
    <mat-form-field appearance="outline" class="message-input">
      <mat-label>Mensaje</mat-label>
      <input matInput [(ngModel)]="newMessage" (keyup.enter)="sendMessage()" placeholder="Escribe un mensaje..." />
    </mat-form-field>
    <button mat-flat-button color="primary" (click)="sendMessage()">Enviar</button>
  </mat-card-actions>
</mat-card>
